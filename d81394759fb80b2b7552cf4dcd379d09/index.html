<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- DEZE BLIJKT NODIG TE ZIJN VOOR DE ANIMATIES -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: VrouwHeerTargets.mind; maxTrack: 2" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
        <a-assets>
<!--
          <img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
   	        <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
            <a-asset-item id="man" src="bert.jpg"></a-asset-item>
            <a-asset-item id="vrouw" src="ellen.jpg"></a-asset-item>
            <a-asset-item id="bearModel" src="scene.gltf"></a-asset-item>
            <a-asset-item id="raccoonModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon/scene.gltf"></a-asset-item>
-->
            <a-asset-item id="bearModel" src="models/bear/scene.gltf"></a-asset-item>
            <a-asset-item id="raccoonModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon/scene.gltf"></a-asset-item>

        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>



        <!-- Target #1 is de Harten Vrouw -->
        <a-entity mindar-image-target="targetIndex: 0">

          <a-entity gltf-model="Bert_Partner.glb" position="0 0 0" rotation="90 0 0" scale="3 3 3" animation-mixer></a-entity>

          
<!--
            Eigen GLB
            <a-entity gltf-model="models/cube/marzfirstmodel.glb" position="0 -0.5 0" scale="0.1 0.1 0.1" animation-mixer></a-entity>

            DEZE WERKT: (a-gltf-model met src via Referentie naar a-asset-item)
            <a-gltf-model src="#raccoonModel" rotation="0 0 0" position="0 0 0" scale="0.1 0.1 0.1" animation-mixer></a-gltf-model>
            
            DEZE WERKT: (a-gltf-model met src direct in property )
            <a-gltf-model src="models/bear/scene.gltf" rotation="0 0 0" position="0 0 0" scale="0.1 0.1 0.1" animation-mixer></a-gltf-model>

            DEZE WERKT: (a-entry met gltf-model via Referentie naar a-asset-item)
            <a-entity gltf-model="#raccoonModel" position="0 -0.5 0" scale="0.1 0.1 0.1" animation-mixer></a-entity>

            DEZE WERKT: (a-entry met gltf-model direct in property)
            <a-entity gltf-model="models/bear/scene.gltf" position="0 -0.5 0" scale="0.1 0.1 0.1" animation-mixer></a-entity>

            DEZE WERKT: a-entry met gltf-model direct in property
            <a-entity gltf-model="MonaLisa.glb" position="0.5 0 0" scale="1 1 1" rotation="90 0 0" response-type="arraybuffer" animation-mixer="clip:Action.001"></a-entity>

            DEZE WERKT: a-entry met gltf-model direct in property
            <a-entity gltf-model="models/bee-gltf/source/bee_gltf.gltf" position="0 0 0" scale="1 1 1" animation-mixer></a-entity>

            DEZE WERKT: a-image
            <a-image src="Ellen.jpg" rotation="0 0 0" scale="2 2 2"></a-image>

            DEZE WERKT: a-plane object
            <a-plane color="blue" opaciy="0.5" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
-->
        </a-entity>
        
        <!-- Target #1 is de Harten Heer -->
        <a-entity mindar-image-target="targetIndex: 1">
          <a-entity gltf-model="Bert_Zelf.glb" position="0 0 0" rotation="90 0 0" scale="3 3 3" animation-mixer></a-entity>

            <!-- <a-image src="Bert.jpg" rotation="0 0 0" scale="1 1 1"></a-image> -->
            
        </a-entity>
    </a-scene>
  </body>
</html>
